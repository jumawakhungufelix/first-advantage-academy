<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
<div class="header" >
      <nav class="site-nav">
<ul style="display: flex; list-style-type:none;">
<li ><a  href="index.html">Home</a></li>
<li ><a  href="participate.html">Participate</a></li>
<li ><a  href="register.html">Register</a></li>
<li ><a  href="https://www.cog.go.ke" target="_blank" rel="noopener">Council of Governors</a></li>
</ul>
</nav>
</div>

<form action="https://httpbin.org/post" method="post">
<fieldset>

    <legend>Where you take part</legend>
<p>
<label for="county">County</label>
<select id="county" name="county" required>
<option value="">Choose your county</option>
<option value="kiambu" selected>Kiambu</option>
<option value="nairobi">Nairobi City</option>
<option value="machakos">Machakos</option>
<option value="nakuru">Nakuru</option>
<option value="kisumu">Kisumu</option>
<option value="mombasa">Mombasa</option>
</select>
</p>

<label for="ward">Ward</label>
<input id="ward" name="ward" type="text" required list="nairobi-wards">
<datalist id="nairobi-wards">
    <option value="Karen">Karen</option>
    <option value="Pipeline">Pipeline</option>
    <option value="Imara Daima">Imara Daima</option>
    <option value="Kasarani">Kasarani</option>
    <option value="Industrial Area">Industrial Area</option>
    <option value="Umoja">Umoja</option>
    <option value="Jacaranda">Jacaranda</option>
</datalist>
</fieldset>




<fieldset>
<legend>How we reach you</legend>
<p>
<label for="name">Full name</label>
<input id="name" name="name" type="text" required autocomplete="name">
</p>
<p>
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="email">
</p>
<p>
<label for="phone">Phone</label>
<input id="phone" name="phone" type="tel"
pattern="^\+?[0-9 ]{9,15}$" autocomplete="tel">
</p>
<p>Send notifications by:</p>
<p><label><input type="radio" name="channel" value="sms" checked> SMS</label></p>
<p><label><input type="radio" name="channel" value="email"> Email</label></p>
<p><label><input type="radio" name="channel" value="both"> Both</label></p>
</fieldset>
<fieldset>
<legend>What you want to hear about</legend>
<p><label><input type="checkbox" name="topic" value="health"> Health</label></p>
<p><label><input type="checkbox" name="topic" value="water"> Water</label></p>
<p><label><input type="checkbox" name="topic" value="roads"> Roads</label></p>
<p><label><input type="checkbox" name="topic" value="education"> Education</label></p>
<p>
<label for="views">Your view on the draft budget (optional)</label>
<textarea id="views" name="views" rows="4"></textarea>
</p>
</fieldset>
<p>
<label><input type="checkbox" name="consent" value="yes" required>
I agree to receive county notifications for my ward.</label>
</p>
<button type="submit">Register</button>
</form>

</body>
</html>
